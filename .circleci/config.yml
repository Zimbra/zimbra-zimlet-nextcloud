version: 2.1

references:
  checkout_steps: &checkout_steps
    steps:
      - checkout:
          method: full

      - run:
          name: Checking out dependencies..
          command: |
            git clone https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b master --single-branch https://$GITHUB_ACCESS_TOKEN@github.com/Zimbra/zm-nexus.git ~/zm-nexus
            echo "BUILD_NO=$CIRCLE_BUILD_NUM" > config.build

      - persist_to_workspace:
          root: ..
          paths:
            - zimbra-zimlet-nextcloud
            - zm-pkg-tool
            - zm-nexus

  # ---- regular (non-develop) build ----
  build_steps: &build_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating package
          command: make zimbra-zimlet-pkg

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zimbra-zimlet-nextcloud/build/dist/*

  # ---------------------------------------------------------------------------
  # develop-only build step (deb platforms)
  # Patches Makefile at build time:
  #   --pkg-version  → <major>.<minor>.<micro>.<build_num>.<git_ts>
  #   --pkg-release  → 1~develop-snapshot
  # ---------------------------------------------------------------------------
  build_develop_deb: &build_develop_deb
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating develop-snapshot package (deb)
          command: |
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
            MAJOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f1)
            MINOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f2)
            MICRO_TAG=$(echo "$BUILD_RELEASE_NUMBER"   | cut -d'.' -f3)
            GIT_TS=$(git log --pretty=format:%ct -1)
            PKG_VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${MICRO_TAG}.${CIRCLE_BUILD_NUM}.${GIT_TS}"
            PKG_RELEASE="1~develop-snapshot"

            echo "PKG_VERSION=${PKG_VERSION}  PKG_RELEASE=${PKG_RELEASE}"

            cp Makefile Makefile.orig
            # Replace the hardcoded --pkg-version line
            sed -i "s|--pkg-version=.*|--pkg-version=${PKG_VERSION} \\\\|" Makefile
            sed -i "s|--pkg-release=1\b|--pkg-release=${PKG_RELEASE}|g" Makefile

            echo "--- patched Makefile ---"
            grep -E "pkg-version|pkg-release" Makefile

            make zimbra-zimlet-pkg

            mv Makefile.orig Makefile

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zimbra-zimlet-nextcloud/build/dist/*

  # ---------------------------------------------------------------------------
  # develop-only build step (rpm platforms)
  # ---------------------------------------------------------------------------
  build_develop_rpm: &build_develop_rpm
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Creating develop-snapshot package (rpm)
          command: |
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
            BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
            MAJOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f1)
            MINOR_VERSION=$(echo "$BUILD_RELEASE_NUMBER" | cut -d'.' -f2)
            MICRO_TAG=$(echo "$BUILD_RELEASE_NUMBER"   | cut -d'.' -f3)
            GIT_TS=$(git log --pretty=format:%ct -1)
            PKG_VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${MICRO_TAG}.${CIRCLE_BUILD_NUM}.${GIT_TS}"
            PKG_RELEASE="1_develop_snapshot"

            echo "PKG_VERSION=${PKG_VERSION}  PKG_RELEASE=${PKG_RELEASE}"

            cp Makefile Makefile.orig
            sed -i "s|--pkg-version=.*|--pkg-version=${PKG_VERSION} \\\\|" Makefile
            sed -i "s|--pkg-release=1\b|--pkg-release=${PKG_RELEASE}|g" Makefile

            echo "--- patched Makefile ---"
            grep -E "pkg-version|pkg-release" Makefile

            make zimbra-zimlet-pkg

            mv Makefile.orig Makefile

      - store_artifacts:
          path: build/dist

      - persist_to_workspace:
          root: ..
          paths: zimbra-zimlet-nextcloud/build/dist/*

  # ---------------------------------------------------------------------------
  # publish_packages — fix: pass "build/dist" (relative to working_directory)
  # ---------------------------------------------------------------------------
  publish_packages_job_steps: &publish_packages_job_steps
    steps:
      - attach_workspace:
          at: ..
      - run:
          name: Publish package artifacts to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
            bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "build/dist"

############################################################################

jobs:
  checkout:
    working_directory: ~/zimbra-zimlet-nextcloud
