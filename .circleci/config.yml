workflows:
   version: 2
   # -------------------------------------------------------------------------------
   # only for develop branch: build -> publish_packages (no S3 upload)
   # -------------------------------------------------------------------------------
   develop-workflow:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc
         - build_u24:
            requires:
               - checkout
            context:
               - docker-dev-registry
               - build-info
            filters:
