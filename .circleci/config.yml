version: 2.1

############################################################################

references:
   checkout_job_steps: &checkout_job_steps
      steps:
         - checkout
         - run:
            name: Checking out dependencies
            command: |
               git clone https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b master --single-branch \
                  https://$GITHUB_ACCESS_TOKEN@github.com/Zimbra/zm-nexus.git ~/zm-nexus
         - persist_to_workspace:
            root: ..
            paths:
               - zimbra-zimlet-nextcloud
               - zm-pkg-tool
               - zm-nexus

   # ---------------------------------------------------------------------------
   # Ubuntu build anchor
   # ---------------------------------------------------------------------------
   build_ubuntu_job_steps: &build_ubuntu_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating build
            command: |
               sudo apt-get update

               if [ "$CIRCLE_BRANCH" = "poc" ]; then
                  # develop: patch Makefile to use develop-snapshot revision (deb format: ~)
                  BUILDINFO_REVISION="1~develop-snapshot"
               else
                  BUILDINFO_REVISION="1"
               fi

               # Patch --pkg-release in Makefile to inject develop-snapshot revision
               sed -i "s/--pkg-release=1/--pkg-release=${BUILDINFO_REVISION}/" Makefile
               echo "Patched Makefile pkg-release:"
               grep "\-\-pkg-release" Makefile

               make
         - store_artifacts:
            path: build/dist
         - persist_to_workspace:
            root: ..
            paths:
               - zimbra-zimlet-nextcloud/build/dist/*

   # ---------------------------------------------------------------------------
   # CentOS / RHEL build anchor
   # ---------------------------------------------------------------------------
   build_centos_job_steps: &build_centos_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating build
            command: |
               if [ "$CIRCLE_BRANCH" = "poc" ]; then
                  # develop: patch Makefile to use develop-snapshot revision (rpm format: _)
                  BUILDINFO_REVISION="1_develop_snapshot"
               else
                  BUILDINFO_REVISION="1"
               fi

               # Patch --pkg-release in Makefile to inject develop-snapshot revision
               sed -i "s/--pkg-release=1/--pkg-release=${BUILDINFO_REVISION}/" Makefile
               echo "Patched Makefile pkg-release:"
               grep "\-\-pkg-release" Makefile

               make
         - store_artifacts:
            path: build/dist
         - persist_to_workspace:
            root: ..
            paths:
               - zimbra-zimlet-nextcloud/build/dist/*

   deploy_s3_job_steps: &deploy_s3_job_steps
      docker:
         - image: 'cimg/python:3.10'
      resource_class: small
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Create a zip file for artifacts and upload them to the OCI bucket
            command: |
               cd build/dist/
               zip -r $CIRCLE_PROJECT_REPONAME.zip .
               ZIP_FILE_PATH="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM/archives/$CIRCLE_PROJECT_REPONAME.zip"
               curl -X PUT "$OCI_PAR_URL$ZIP_FILE_PATH" -T $CIRCLE_PROJECT_REPONAME.zip
               echo "artifacts uploaded to $ZIP_FILE_PATH"

   publish_packages_job_steps: &publish_packages_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Publish package artifacts to Nexus
            command: |
               sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
               bash ../zm-nexus/scripts/publish-packages-to-nexus.sh "zimbra-zimlet-nextcloud/build/dist"

############################################################################

jobs:
   checkout:
      working_directory: ~/zimbra-zimlet-nextcloud
      shell: /bin/bash -eo pipefail
      docker:
         - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-18.04
           auth:
             username: $DOCKER_USER
             password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build_u24:
      working_directory: ~/zimbra-zimlet-nextcloud
      shell: /bin/bash -eo pipefail
      docker:
         - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
           auth:
             username: $DOCKER_USER
             password: $DOCKER_PASS
      resource_class: medium
      <<: *build_ubuntu_job_steps

   build_u22:
      working_directory: ~/zimbra-zimlet-nextcloud
