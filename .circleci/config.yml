   build_c7:
      working_directory: ~/zimbra-zimlet-nextcloud
      shell: /bin/bash -eo pipefail
      docker:
         - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-7
           auth:
             username: $DOCKER_USER
             password: $DOCKER_PASS
      resource_class: medium
      <<: *build_centos_job_steps

   deploy_s3:
      working_directory: ~/zimbra-zimlet-nextcloud
      shell: /bin/bash -eo pipefail
      <<: *deploy_s3_job_steps

   publish_packages:
      working_directory: ~/zimbra-zimlet-nextcloud
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      docker:
         - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
           auth:
             username: $DOCKER_USER
             password: $DOCKER_PASS
      resource_class: small
      <<: *publish_packages_job_steps

############################################################################

workflows:
   version: 2

   # -------------------------------------------------------------------------------
   # develop branch: checkout → all builds → publish_packages to Nexus (no JAR)
   # -------------------------------------------------------------------------------
   develop-workflow:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_u24:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_u22:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_u20:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_u18:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_u16:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_c9:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_c8:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - build_c7:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                only: poc

         - publish_packages:
            context:
               - docker-dev-registry
               - nexus-dev-artifactory
            requires:
               - build_u24
               - build_u22
               - build_u20
               - build_u18
               - build_u16
               - build_c9
               - build_c8
               - build_c7
            filters:
              branches:
                only: poc

   # -------------------------------------------------------------------------------
   # non-develop branches: approval gate → checkout → all builds → deploy_s3
   # -------------------------------------------------------------------------------
   non-develop-workflow:
      jobs:
         - build:
            type: approval
            filters:
              branches:
                ignore: poc

         - checkout:
            requires:
               - build
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_u24:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_u22:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_u20:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_u18:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_u16:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_c9:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_c8:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - build_c7:
            requires:
               - checkout
            context:
               - docker-dev-registry
            filters:
              branches:
                ignore: poc

         - deploy_s3_hold:
            type: approval
            requires:
               - build_u24
               - build_u22
               - build_u20
               - build_u18
               - build_u16
               - build_c9
               - build_c8
               - build_c7
            filters:
              branches:
                ignore: poc

         - deploy_s3:
            context:
               - oracle
            requires:
               - deploy_s3_hold
            filters:
              branches:
                ignore: poc
